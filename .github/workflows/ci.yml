name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    name: WPF-Build + Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build VpnSwitch.slnx -c Release
      - name: Tests
        run: dotnet run --project tests/VpnSwitch.Tests -c Release --no-build
